rootProject.name = 'simple-render'

// Two cores, one direction of dependency:  ui  ──►  engine  ◄──  plugins
include 'engine'                // render engine: no JavaFX on its classpath
include 'ui'                    // JavaFX desktop front-end that hosts the engine
include 'plugins:obj-plugin'    // model importers, loaded at runtime through PF4J
include 'plugins:gltf-plugin'
