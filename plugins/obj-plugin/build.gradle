plugins {
    id 'java'
}

group = 'com.simplerender'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.pf4j:pf4j:3.12.0'
    annotationProcessor 'org.pf4j:pf4j:3.12.0'
    implementation project(':')
}

jar {
    manifest {
        attributes(
            'Plugin-Id': 'obj-importer',
            'Plugin-Class': 'com.simplerender.plugin.obj.ObjImporterPlugin',
            'Plugin-Version': project.version,
            'Plugin-Provider': 'simple-render'
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
