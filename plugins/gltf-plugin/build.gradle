plugins {
    id 'java'
}

group = 'com.simplerender'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.openize:drako:26.3.0' // pure-Java Draco decoder, ~375 KB
    implementation 'org.pf4j:pf4j:3.12.0'
    annotationProcessor 'org.pf4j:pf4j:3.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation project(':engine')

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    manifest {
        attributes(
            'Plugin-Id': 'gltf-importer',
            'Plugin-Class': 'com.simplerender.plugin.gltf.GltfImporterPlugin',
            'Plugin-Version': project.version,
            'Plugin-Provider': 'simple-render'
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

